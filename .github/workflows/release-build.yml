name: Build & Release (multi-arch)

on:
  push:
    branches: ["release"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # =====================
          # Windows
          # =====================
          - id: windows_amd64
            goos: windows
            goarch: amd64
            suffix: .exe
            out_os: windows
            out_arch: amd64

          - id: windows_arm64
            goos: windows
            goarch: arm64
            suffix: .exe
            out_os: windows
            out_arch: arm64

          # =====================
          # macOS (darwin)
          # =====================
          - id: darwin_amd64
            goos: darwin
            goarch: amd64
            suffix: ""
            out_os: darwin
            out_arch: amd64

          - id: darwin_arm64
            goos: darwin
            goarch: arm64
            suffix: ""
            out_os: darwin
            out_arch: arm64

          # =====================
          # Linux (通用)
          # =====================
          - id: linux_amd64
            goos: linux
            goarch: amd64
            suffix: ""
            out_os: linux
            out_arch: amd64

          - id: linux_arm64
            goos: linux
            goarch: arm64
            suffix: ""
            out_os: linux
            out_arch: arm64

          # 可选但很常见：32 位 ARM
          - id: linux_armv7
            goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
            out_os: linux
            out_arch: armv7

          # =====================
          # OpenWrt / 路由器
          # =====================
          - id: openwrt_x86_64
            goos: linux
            goarch: amd64
            suffix: ""
            out_os: openwrt
            out_arch: x86_64

          - id: openwrt_aarch64
            goos: linux
            goarch: arm64
            suffix: ""
            out_os: openwrt
            out_arch: aarch64

          - id: openwrt_armv7
            goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
            out_os: openwrt
            out_arch: armv7

          - id: openwrt_mips
            goos: linux
            goarch: mips
            gomips: softfloat
            suffix: ""
            out_os: openwrt
            out_arch: mips

          - id: openwrt_mipsle
            goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: ""
            out_os: openwrt
            out_arch: mipsle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Tag 触发：refs/tags/v1.2.3 -> 1.2.3（去掉前缀 v）
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            # 分支/手动触发：用 dev + 短 commit，避免覆盖
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            VERSION="dev_${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          OUT_OS: ${{ matrix.out_os }}
          OUT_ARCH: ${{ matrix.out_arch }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # 风格：name_version_os_arch
          OUT="dist/sublinkX_${VERSION}_${OUT_OS}_${OUT_ARCH}${SUFFIX}"

          # 入口为模块根目录 main.go
          go build -trimpath -ldflags="-s -w" -o "${OUT}" main.go

          # 非 Windows：加可执行位（有些下载/解压场景会丢）
          if [[ "${GOOS}" != "windows" ]]; then
            chmod +x "${OUT}"
          fi

          # 单文件 sha256
          (cd dist && sha256sum "$(basename "${OUT}")" > "$(basename "${OUT}").sha256")

      - name: Upload artifact (per target)
        uses: actions/upload-artifact@v4
        with:
          name: sublinkX_${{ steps.ver.outputs.version }}_${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release (tags only)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Collect assets & SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets

          # 收集所有二进制与 *.sha256
          find all_artifacts -type f -print -exec cp -f {} release_assets/ \;

          # 合并 SHA256SUMS（从各自的单文件 sha256 汇总）
          (cd release_assets && \
            ls -1 *.sha256 2>/dev/null | xargs -r cat > SHA256SUMS)

          rm -f release_assets/*.sha256

          echo "Assets:"
          ls -lah release_assets

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
